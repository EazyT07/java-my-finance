<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Accent Gradient for Spending/Growth -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- App Tile Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Bar Chart Columns -->
  <rect x="110" y="280" width="48" height="120" rx="12" fill="#334155" opacity="0.7"/>
  <rect x="190" y="220" width="48" height="180" rx="12" fill="#334155" opacity="0.9"/>
  <rect x="270" y="260" width="48" height="140" rx="12" fill="#334155" opacity="0.7"/>
  <rect x="350" y="140" width="48" height="260" rx="12" fill="url(#chartGrad)"/>

  <!-- Trending Trendline -->
  <path d="M 110 260 L 190 200 L 270 240 L 374 120" fill="none" stroke="url(#chartGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Trend Node -->
  <circle cx="374" cy="120" r="18" fill="#38bdf8" stroke="#ffffff" stroke-width="6"/>
</svg>
